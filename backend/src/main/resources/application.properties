# ============================================================
# MecAuto - configuración principal
# Los valores sensibles llegan por VARIABLES DE ENTORNO (ver README).
# Nunca escribas contraseñas reales en este archivo.
# ============================================================
spring.application.name=mecauto
server.port=${MECAUTO_PORT:8080}
spring.jackson.time-zone=America/Lima
spring.jackson.default-property-inclusion=non_null

# --- Base de datos: Microsoft SQL Server ---
# Cifrado activado y certificado validado (valor seguro por defecto).
# Si tu SQL Server local usa certificado autofirmado, mira la sección
# "Conexión a SQL Server" del README (solo para desarrollo local).
spring.datasource.url=${MECAUTO_DB_URL:jdbc:sqlserver://localhost:1433;databaseName=MECAUTO;encrypt=true;trustServerCertificate=false;sendStringParametersAsUnicode=false}
spring.datasource.username=${MECAUTO_DB_USER}
spring.datasource.password=${MECAUTO_DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# --- JPA / Hibernate ---
# El esquema se crea con database/schema.sql (versionado). Hibernate NO lo modifica.
# Para que Hibernate compare entidades y tablas al arrancar: MECAUTO_DDL_AUTO=validate
spring.jpa.hibernate.ddl-auto=${MECAUTO_DDL_AUTO:none}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.jpa.properties.hibernate.jdbc.batch_size=25

# --- Seguridad (JWT) ---
# MECAUTO_JWT_SECRET debe tener al menos 32 caracteres. No tiene valor por defecto a propósito.
mecauto.jwt.secret=${MECAUTO_JWT_SECRET}
mecauto.jwt.expiracion-minutos=${MECAUTO_JWT_MINUTOS:480}
# Origen(es) del frontend permitidos por CORS, separados por coma
mecauto.cors.origenes=${MECAUTO_CORS_ORIGENES:http://localhost:5173}
# Cuenta administradora inicial: solo se crea si NO existe ningún usuario.
# Define ambas variables la primera vez; luego puedes quitarlas.
mecauto.admin-inicial.username=${MECAUTO_ADMIN_USER:}
mecauto.admin-inicial.password=${MECAUTO_ADMIN_PASSWORD:}
mecauto.admin-inicial.nombre=${MECAUTO_ADMIN_NOMBRE:Administrador}
# Límite de solicitudes de cita pública por IP (anti-spam)
mecauto.publico.citas-por-ventana=${MECAUTO_CITAS_POR_VENTANA:5}
mecauto.publico.ventana-minutos=${MECAUTO_CITAS_VENTANA_MIN:10}

# --- Recuperación de contraseña del personal ---
# El código de 6 dígitos llega al correo o al celular registrado en el usuario.
# Correo (SMTP). Con Gmail: host smtp.gmail.com, puerto 587 y una "contraseña de aplicación".
spring.mail.host=${MECAUTO_MAIL_HOST:}
spring.mail.port=${MECAUTO_MAIL_PORT:587}
spring.mail.username=${MECAUTO_MAIL_USER:}
spring.mail.password=${MECAUTO_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
mecauto.recuperacion.remitente=${MECAUTO_MAIL_REMITENTE:}
# SMS con Twilio (opcional, de pago). Sin estas variables solo se puede recuperar por correo.
mecauto.recuperacion.twilio-sid=${MECAUTO_TWILIO_SID:}
mecauto.recuperacion.twilio-token=${MECAUTO_TWILIO_TOKEN:}
mecauto.recuperacion.twilio-numero=${MECAUTO_TWILIO_NUMERO:}
# true = si no hay correo/SMS configurado, el código se escribe en el log. NUNCA en producción.
mecauto.recuperacion.codigo-en-log=${MECAUTO_CODIGO_EN_LOG:false}

# --- Documentación de la API ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.enabled=${MECAUTO_DOCS:true}
springdoc.swagger-ui.enabled=${MECAUTO_DOCS:true}

# --- Monitoreo ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
# El correo es opcional (solo recuperación de contraseña): que no marque la API como caída si no está configurado
management.health.mail.enabled=false

# --- Logs (Logback) ---
logging.level.root=INFO
logging.level.pe.mecauto=INFO
logging.file.name=logs/mecauto.log
logging.logback.rollingpolicy.max-file-size=5MB
logging.logback.rollingpolicy.max-history=14
