# Perfil de pruebas de integración: H2 en memoria (modo SQL Server). NO usa SQL Server real.
spring.datasource.url=jdbc:h2:mem:mecauto_test;MODE=MSSQLServer;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
mecauto.jwt.secret=clave-solo-para-pruebas-automaticas-0123456789
mecauto.admin-inicial.username=
mecauto.admin-inicial.password=
mecauto.cors.origenes=http://localhost:5173
logging.file.name=target/test.log
